spring.application.name=BM
server.port=8080

# ==========================================
# 数据库配置 (MySQL)
# 建库脚本: src/main/java/com/myproject/bm/sql/BMtable.sql
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/BM?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# MyBatis-Plus
# ==========================================
mybatis-plus.configuration.map-underscore-to-camel-case=true

# ==========================================
# Jackson
# ==========================================
spring.jackson.time-zone=GMT+8
